server {
    listen 443 ssl;
    server_name iploan-api.mustree.kr;
    client_max_body_size 51m;

    ssl_certificate /etc/letsencrypt/live/iploan-api.mustree.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iploan-api.mustree.kr/privkey.pem;

    location /api/ {
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:58080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
